name: Pubblica su GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/*.test.mjs
      - run: node tools/privacy-check.mjs
      - run: node tools/i18n-check.mjs || echo "::warning::traduzioni incomplete"
      - run: node tools/legal-check.mjs
      - name: Prepara il sito
        run: |
          V=$(grep -oP 'APP_VERSION = "\K[^"]+' js/version.js)
          mkdir _site && cp -r index.html manifest.webmanifest sw.js css js locales icons fonts vendor _site/ && rm -f _site/fonts/anteprima.html
          sed -i "s/const VERSION = \"dev\"/const VERSION = \"$V\"/" _site/sw.js
          # chiavi pubbliche dei servizi cloud: solo nel sito pubblicato, mai nel sorgente
          sed -i "s/dropboxKey: \"\"/dropboxKey: \"$DROPBOX_APP_KEY\"/; s/googleClientId: \"\"/googleClientId: \"$GOOGLE_CLIENT_ID\"/" _site/js/config.js
        env:
          DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
